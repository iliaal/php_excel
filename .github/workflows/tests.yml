name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin
      - name: Cache LibXL
        id: cache-libxl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libxl-5.2.0.1
          key: libxl-lin-5.2.0.1-v1
      - name: Download LibXL
        if: steps.cache-libxl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.libxl.com/download/libxl-lin-5.2.0.1.tar.gz" -o libxl.tar.gz
          tar xzf libxl.tar.gz
          extracted=$(ls -d libxl-* | grep -v tar | head -1)
          if [ "$extracted" != "libxl-5.2.0.1" ]; then
            mv "$extracted" "libxl-5.2.0.1"
          fi
      - name: Download PIE
        run: |
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/php-excel:*@dev \
            --with-excel \
            --with-libxl-incdir=$PWD/libxl-5.2.0.1/include_c \
            --with-libxl-libdir=$PWD/libxl-5.2.0.1/lib64

  linux:
    name: PHP ${{ matrix.php }} - libxl ${{ matrix.libxl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        libxl: ['5.2.0.1']
        # Non-ceiling libxl lanes are build-only: the Run tests step below
        # runs only on the ceiling (5.2.0.1) lane.
        include:
          - php: '8.4'
            libxl: '4.6.0'
          - php: '8.4'
            libxl: '5.1.0'
    env:
      LIBXL_VERSION: ${{ matrix.libxl }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Cache LibXL
        id: cache-libxl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libxl-${{ matrix.libxl }}
          key: libxl-lin-${{ matrix.libxl }}-v1

      - name: Download LibXL
        if: steps.cache-libxl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.libxl.com/download/libxl-lin-${LIBXL_VERSION}.tar.gz" -o libxl.tar.gz
          tar xzf libxl.tar.gz
          # tarball extracts as libxl-X.Y.Z.0, normalize to libxl-X.Y.Z
          extracted=$(ls -d libxl-* | grep -v tar | head -1)
          if [ "$extracted" != "libxl-${LIBXL_VERSION}" ]; then
            mv "$extracted" "libxl-${LIBXL_VERSION}"
          fi
          ls "libxl-${LIBXL_VERSION}/include_c/libxl.h"

      - name: Build extension
        run: |
          phpize
          ./configure \
            --with-excel \
            --with-libxl-incdir="${WORKSPACE}/libxl-${LIBXL_VERSION}/include_c" \
            --with-libxl-libdir="${WORKSPACE}/libxl-${LIBXL_VERSION}/lib64"
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Build failed (make exited $BUILD_STATUS)"
            exit 1
          fi
          WARNINGS=$(grep -c 'warning:' build.log || true)
          if [ "$WARNINGS" -gt 0 ]; then
            echo "::error::Build produced $WARNINGS warning(s)"
            exit 1
          fi

      - name: Run tests
        if: matrix.libxl == '5.2.0.1'
        run: |
          export LD_LIBRARY_PATH="${WORKSPACE}/libxl-${LIBXL_VERSION}/lib64"
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/excel.so"
          export NO_INTERACTION=1
          php -d extension=$(pwd)/modules/excel.so -r '
            if (!extension_loaded("excel")) {
              fwrite(STDERR, "excel extension did not load\n");
              exit(1);
            }
          '
          set -o pipefail
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee test-output.txt
          RUN_STATUS=${PIPESTATUS[0]}
          if [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::run-tests.php exited non-zero ($RUN_STATUS)"
            exit 1
          fi
          if grep -qP 'Tests (failed|leaked)\s*:\s*[1-9]' test-output.txt; then
            echo "::error::Tests failed or leaked"
            exit 1
          fi
          if ! grep -qP 'Tests passed\s*:\s*[1-9][0-9]*' test-output.txt; then
            echo "::error::No PHPT tests passed"
            exit 1
          fi

  stub-freshness:
    name: Stub freshness (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor/ceiling only: regen output is PHP-version independent, so
        # exercising the oldest and newest supported runtimes is enough.
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          # gen_stub.php tokenizes the stub; tokenizer is core but make the
          # dependency explicit so a slim PHP never fails this job oddly.
          extensions: tokenizer
          coverage: none

      - name: Fetch gen_stub.php
        # excel_arginfo.h is generated with php-src master gen_stub.php, so
        # fetch that same generator instead of pinning a stale copy.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/php/php-src/master/build/gen_stub.php" -o /tmp/gen_stub.php

      - name: Verify excel_arginfo.h is up to date
        run: |
          php /tmp/gen_stub.php excel.stub.php
          git diff --exit-code -- excel_arginfo.h

  linux-zts:
    name: PHP ${{ matrix.php }} ZTS - Linux (canary)
    runs-on: ubuntu-latest
    env:
      PHPTS: zts
      WORKSPACE: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP (ZTS)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Cache LibXL
        id: cache-libxl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libxl-5.2.0.1
          key: libxl-lin-5.2.0.1-v1

      - name: Download LibXL
        if: steps.cache-libxl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.libxl.com/download/libxl-lin-5.2.0.1.tar.gz" -o libxl.tar.gz
          tar xzf libxl.tar.gz
          extracted=$(ls -d libxl-* | grep -v tar | head -1)
          if [ "$extracted" != "libxl-5.2.0.1" ]; then
            mv "$extracted" "libxl-5.2.0.1"
          fi

      - name: Build extension under ZTS
        run: |
          phpize
          ./configure \
            --with-excel \
            --with-libxl-incdir="${WORKSPACE}/libxl-5.2.0.1/include_c" \
            --with-libxl-libdir="${WORKSPACE}/libxl-5.2.0.1/lib64" \
            --with-php-config=$(which php-config)
          make -j$(nproc)

      - name: Run tests under ZTS
        run: |
          export LD_LIBRARY_PATH="${WORKSPACE}/libxl-5.2.0.1/lib64"
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/excel.so"
          export NO_INTERACTION=1
          php -d extension=$(pwd)/modules/excel.so -r '
            if (!extension_loaded("excel")) {
              fwrite(STDERR, "excel extension did not load under ZTS\n");
              exit(1);
            }
          '
          set -o pipefail
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/ 2>&1 | tee test-output.txt
          RUN_STATUS=${PIPESTATUS[0]}
          if [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::run-tests.php exited non-zero ($RUN_STATUS) under ZTS"
            exit 1
          fi
          if grep -qP 'Tests (failed|leaked)\s*:\s*[1-9]' test-output.txt; then
            echo "::error::Tests failed or leaked under ZTS"
            exit 1
          fi
          if ! grep -qP 'Tests passed\s*:\s*[1-9][0-9]*' test-output.txt; then
            echo "::error::No PHPT tests passed under ZTS"
            exit 1
          fi

  asan:
    name: PHP ${{ matrix.php }} - ASAN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    env:
      # detect_leaks=1 pinned explicitly. LSan's default is on under
      # Linux ASan; pinning prevents a future ASAN_OPTIONS edit from
      # silently flipping it. Known-good leaks from the vendored libxl
      # SDK (if any surface) go in .github/lsan-suppressions.txt;
      # prefer narrow suppressions over blanket detect_leaks=0. See
      # ~/ai/wiki/debugging/asan-php-extension.md.
      ASAN_OPTIONS: exitcode=139:verify_asan_link_order=0:detect_odr_violation=0:detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      USE_TRACKED_ALLOC: 1
      PHP_VERSION: ${{ matrix.php }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm clang re2c bison autoconf

      - name: Build PHP with ASAN
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address -fno-sanitize=function -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address" \
          ./configure \
            --enable-debug \
            --enable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Cache LibXL
        id: cache-libxl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libxl-5.2.0.1
          key: libxl-lin-5.2.0.1-v1

      - name: Download LibXL
        if: steps.cache-libxl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.libxl.com/download/libxl-lin-5.2.0.1.tar.gz" -o libxl.tar.gz
          tar xzf libxl.tar.gz
          extracted=$(ls -d libxl-* | grep -v tar | head -1)
          if [ "$extracted" != "libxl-5.2.0.1" ]; then
            mv "$extracted" "libxl-5.2.0.1"
          fi

      - name: Build extension with ASAN
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address" \
          ./configure \
            --with-excel \
            --with-libxl-incdir="${WORKSPACE}/libxl-5.2.0.1/include_c" \
            --with-libxl-libdir="${WORKSPACE}/libxl-5.2.0.1/lib64" \
            --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        run: |
          export LD_LIBRARY_PATH="${WORKSPACE}/libxl-5.2.0.1/lib64"
          # php-asan links the clang ASan runtime statically (no -shared-libasan),
          # so preloading the shared libclang_rt.asan on top of it aborts with
          # "incompatible ASan runtimes". The extension's ASan symbols resolve
          # from php's static runtime at dlopen; only libstdc++ needs preloading
          # so libxl's C++ exceptions unwind before ASan interception. Resolve it
          # via gcc (the dpkg package name is not present on the runner image).
          export LD_PRELOAD=$(gcc -print-file-name=libstdc++.so.6)
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/excel.so"
          export NO_INTERACTION=1
          /tmp/php-asan/bin/php -d extension=$(pwd)/modules/excel.so -r '
            if (!extension_loaded("excel")) {
              fwrite(STDERR, "excel extension did not load under ASAN\n");
              exit(1);
            }
          '
          mapfile -t MAIN_TESTS < <(find tests -name '*.phpt' \
            ! -name '152_table_filter_and_sort_level.phpt' \
            ! -name '161_stale_remove_wrappers.phpt' -print)
          set -o pipefail
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK "${MAIN_TESTS[@]}" 2>&1 | tee /tmp/test-output.txt
          RUN_STATUS=${PIPESTATUS[0]}
          if [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::run-tests.php exited non-zero ($RUN_STATUS) under ASAN"
            exit 1
          fi
          if grep -qP 'Tests (failed|leaked)\s*:\s*[1-9]' /tmp/test-output.txt; then
            echo "::error::Tests failed or leaked under ASAN"
            exit 1
          fi
          if ! grep -qP 'Tests passed\s*:\s*[1-9][0-9]*' /tmp/test-output.txt; then
            echo "::error::No PHPT tests passed under ASAN"
            exit 1
          fi

          LSAN_OPTIONS="suppressions=${WORKSPACE}/.github/lsan-suppressions.txt:print_suppressions=0" \
            /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK \
            tests/152_table_filter_and_sort_level.phpt \
            tests/161_stale_remove_wrappers.phpt 2>&1 | tee /tmp/vendor-leak-tests.txt
          RUN_STATUS=${PIPESTATUS[0]}
          if [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::Known vendor-leak tests exited non-zero ($RUN_STATUS) under ASAN"
            exit 1
          fi
          if grep -qP 'Tests (failed|leaked)\s*:\s*[1-9]' /tmp/vendor-leak-tests.txt; then
            echo "::error::Known vendor-leak tests failed under ASAN"
            exit 1
          fi
          if ! grep -qP 'Tests passed\s*:\s*[1-9][0-9]*' /tmp/vendor-leak-tests.txt; then
            echo "::error::No known vendor-leak PHPT tests passed under ASAN"
            exit 1
          fi

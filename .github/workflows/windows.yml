name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  # Manual pre-tag build check: the release job only runs on
  # `github.event_name == 'release'`, so a dispatch run builds every toolset
  # on the Windows runners without uploading.
  workflow_dispatch:

env:
  LIBXL_VERSION: "5.2.0.1"

permissions: {}

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  windows-matrix:
    name: Generate Windows build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          extension-url: ${{ github.event.repository.html_url }}
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  windows-build:
    name: Build ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and prepare LibXL
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.libxl.com/download/libxl-win-$env:LIBXL_VERSION.zip" -OutFile libxl.zip
          Expand-Archive libxl.zip -DestinationPath libxl-extract
          $dir = Get-ChildItem -Path libxl-extract -Directory | Select-Object -First 1
          $depsDir = "libxl-deps"
          New-Item -ItemType Directory -Path $depsDir -Force

          # Headers (include_c/ for config.w32)
          Copy-Item -Path "$($dir.FullName)\include_c" -Destination "$depsDir\" -Recurse -Force

          # Select lib and bin for target architecture
          if ("$env:MATRIX_ARCH" -eq "x64") {
            Copy-Item -Path "$($dir.FullName)\lib64\libxl.lib" -Destination "$depsDir\libxl.lib" -Force
            Copy-Item -Path "$($dir.FullName)\bin64\libxl.dll" -Destination "$depsDir\libxl.dll" -Force
          } else {
            Copy-Item -Path "$($dir.FullName)\lib\libxl.lib" -Destination "$depsDir\libxl.lib" -Force
            Copy-Item -Path "$($dir.FullName)\bin\libxl.dll" -Destination "$depsDir\libxl.dll" -Force
          }

          # The builder adds this directory to its test process DLL search path.
          $runtimeDeps = Join-Path $env:GITHUB_WORKSPACE 'build\deps\bin'
          New-Item -ItemType Directory -Path $runtimeDeps -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $depsDir 'libxl.dll') -Destination $runtimeDeps -Force

          Get-ChildItem $depsDir -Recurse | Select-Object FullName
        env:
          MATRIX_ARCH: ${{ matrix.arch }}

      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        env:
          TEST_PHP_JUNIT: ${{ github.workspace }}\windows-tests.xml
        with:
          build-directory: build
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: ${{ matrix.arch }}
          args: --with-excel --with-libxl=${{ github.workspace }}\libxl-deps

      - name: Verify extension tests executed
        shell: pwsh
        run: |
          [xml]$report = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows-tests.xml') -Raw
          $passed = @($report.SelectNodes('//testcase[not(skipped or failure or error or warning)]'))
          if ($passed.Count -eq 0) {
            throw 'No extension tests passed; check whether php_excel.dll loaded.'
          }
          $smoke = @($passed | Where-Object { $_.name -match '(^|[\\/])001\.phpt \(' })
          if ($smoke.Count -ne 1) {
            throw 'The required ExcelBook/font smoke test (001.phpt) did not pass.'
          }
          Write-Host "$($passed.Count) extension tests passed, including the ExcelBook/font smoke test."

  release:
    name: Attach Windows DLLs to release
    if: github.event_name == 'release'
    needs: windows-build
    runs-on: ubuntu-latest
    # php-windows-builder/release@v1 calls POST /releases, and newer repos
    # default GITHUB_TOKEN to read-only contents, so the upload 403s
    # without an explicit write scope.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload release artifacts
        uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

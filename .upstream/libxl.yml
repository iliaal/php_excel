# /release-ext library-freshness gate. Schema: ~/.claude/commands/release-ext.md
# detected from .release-config (--with-libxl-libdir=$HOME/ai/libxl-5.2.0.1/lib64)

pinned: 5.2.0.1
resolver: html
url: https://www.libxl.com/download.html
# Capture the full download version including the optional 4th build component
# (e.g. libxl-lin-5.2.0.1.tar.gz). The build component matters: libxl-lin-5.2.0
# shipped a transient 3-arg xlAutoFilterGetSort that 5.2.0.1 reverted to 2-arg,
# so we pin the exact build, not just X.Y.Z.
version_regex: "libxl-lin-([0-9]+\\.[0-9]+\\.[0-9]+(?:\\.[0-9]+)?)\\.tar\\.gz"
note: "Closed-source commercial; download page is the only version source. Linked, not vendored. 5.2.x methods (data validation reader, table isAutoFilter/removeFilter) added this release; built+tested on PHP 8.3/8.4/8.5 against 5.2.0.1, guard-compiled against 5.1.0 and 4.6.0. NB: bare 5.2.0 had a transient 3-arg getSort reverted in 5.2.0.1 — target the .1 build."
